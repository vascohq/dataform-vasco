name: Build and Publish

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v3.0.48-vasco.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 3.0.48-vasco.1)'
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vascohq'

      - name: Install Bazel
        run: npm install -g @bazel/bazelisk

      - name: Build packages
        run: |
          bazel build //packages/@dataform/cli:package //packages/@dataform/core:package
          echo "✓ Packages built"

      - name: Copy packages to writable directory
        run: |
          mkdir -p publish-packages/cli publish-packages/core
          cp -r bazel-bin/packages/@dataform/cli/package/* publish-packages/cli/
          cp -r bazel-bin/packages/@dataform/core/package/* publish-packages/core/
          chmod -R u+w publish-packages/
          echo "✓ Packages copied and made writable"

      - name: Update package.json for GitHub Packages
        run: |
          # Update CLI package
          cd publish-packages/cli
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@vascohq/dataform-cli';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # Update Core package
          cd ../core
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@vascohq/dataform-core';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish CLI
        run: |
          cd publish-packages/cli
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Core
        run: |
          cd publish-packages/core
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✓ Published @vascohq/dataform-cli and @vascohq/dataform-core"
          echo "Version: $(cd publish-packages/cli && node -pe "require('./package.json').version")"

      - name: Create CLI tarball for release
        run: |
          cd publish-packages/cli
          tar -czf dataform-cli.tar.gz bundle.js worker_bundle.js package.json
          echo "✓ Created CLI tarball"

      - name: Get version
        id: version
        run: |
          VERSION=$(cd publish-packages/cli && node -pe "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          files: publish-packages/cli/dataform-cli.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
