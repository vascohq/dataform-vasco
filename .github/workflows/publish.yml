name: Build and Publish

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v3.0.48-vasco.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 3.0.48-vasco.1)'
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bazel
        run: npm install -g @bazel/bazelisk

      - name: Build CLI package
        run: |
          bazel build //packages/@dataform/cli:package
          echo "✓ CLI package built"

      - name: Copy CLI package to writable directory
        run: |
          mkdir -p publish-packages/cli
          cp -r bazel-bin/packages/@dataform/cli/package/* publish-packages/cli/
          chmod -R u+w publish-packages/
          echo "✓ CLI package copied and made writable"

      - name: Create CLI tarball for release
        run: |
          cd publish-packages/cli
          tar -czf dataform-cli.tar.gz bundle.js worker_bundle.js package.json
          echo "✓ Created CLI tarball"

      - name: Get version
        id: version
        run: |
          VERSION=$(cd publish-packages/cli && node -pe "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          files: publish-packages/cli/dataform-cli.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
